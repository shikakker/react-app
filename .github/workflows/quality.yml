name: Quality

on:
  push:
    branches: [ai/product-completion/react-app]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile --non-interactive
      - run: CI=true yarn test --watchAll=false
      - run: yarn build
      - run: yarn audit --groups dependencies --level high
